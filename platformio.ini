; CYDex Lite — vitrine do CYDex + Claude Desktop por BLE (Hardware Buddy).
; Mesma placa: CYD ESP32-2432S028, ST7789, sem PSRAM.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200  ; CH340 desta placa dá ruído a 921600
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; Setup do TFT_eSPI (pinos de board_pins.h) forçado em toda unidade de
    ; compilação antes de qualquer <TFT_eSPI.h>.
    -include include/tft_setup.h
    ; NimBLE só periférico, um computador por vez.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    lvgl/lvgl @ 8.3.11
    bodmer/TFT_eSPI @ 2.5.43
    h2zero/NimBLE-Arduino @ 1.4.3
    bblanchon/ArduinoJson @ 7.2.1

; Igual ao cyd, com o log de memória a cada 10 s ([D][mem]).
[env:cyd_debug]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -D LOG_LEVEL=2

; Testes no PC: só lib/core (C++ puro, sem Arduino).
[env:native_test]
platform = native
test_framework = unity
build_flags =
    -std=c++17
lib_compat_mode = off
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
lib_ignore = lvgl, TFT_eSPI, NimBLE-Arduino
